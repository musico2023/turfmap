<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo lockup: lime icon square + "TurfMap" wordmark, optimized
       for Stripe Checkout (white background). Wordmark in near-black
       so the brand-mark identity persists on a white surface; lime
       square preserves the brand color. -->

  <!-- Lime square -->
  <rect x="20" y="32" width="136" height="136" rx="28" fill="#c5ff3a"/>

  <!-- Crosshair built from fills (not strokes) — same approach as
       turfmap-icon.svg. Centered at (88, 100), scaled ~50% of the
       136 box. -->
  <circle cx="88" cy="100" r="32" fill="#000"/>
  <circle cx="88" cy="100" r="25" fill="#c5ff3a"/>
  <rect x="84.5" y="68"  width="7"  height="14" rx="3.5" fill="#000"/>
  <rect x="84.5" y="118" width="7"  height="14" rx="3.5" fill="#000"/>
  <rect x="68"   y="96.5" width="14" height="7" rx="3.5" fill="#000"/>
  <rect x="118"  y="96.5" width="14" height="7" rx="3.5" fill="#000"/>

  <!-- "TurfMap" wordmark — black, Helvetica Bold for ImageMagick
       compatibility. -->
  <text x="190"
        y="135"
        font-family="Helvetica, Arial, sans-serif"
        font-size="100"
        font-weight="bold"
        letter-spacing="-2"
        fill="#0a0a0a">TurfMap</text>

  <!-- Small lime ™ superscript -->
  <text x="615"
        y="78"
        font-family="Helvetica, Arial, sans-serif"
        font-size="32"
        font-weight="bold"
        fill="#c5ff3a">™</text>
</svg>
